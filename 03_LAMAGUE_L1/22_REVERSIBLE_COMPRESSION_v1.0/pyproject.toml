[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lamague-codec"
version = "1.0.0"
description = "Lossy compaction with a provable floor — protected fields cannot be dropped, and a hash proves they survived"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mackenzie Conor James Clark" }]
keywords = [
    "compaction",
    "audit-log",
    "accountability",
    "agent-context",
    "provenance",
    "record-keeping",
    "reversible-compression",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# No runtime dependencies. The codec is stdlib-only by design: a guarantee that
# ships with a dependency tree is a guarantee with someone else's failure modes
# in it.
dependencies = []

[project.urls]
Homepage = "https://github.com/Lycheetah/Lycheetah-Framework"
Source = "https://github.com/Lycheetah/Lycheetah-Framework/tree/master/03_LAMAGUE_L1/22_REVERSIBLE_COMPRESSION_v1.0"
Specification = "https://github.com/Lycheetah/Lycheetah-Framework/blob/master/03_LAMAGUE_L1/22_REVERSIBLE_COMPRESSION_v1.0/docs/CODEC_SPEC.md"
"Claim boundary" = "https://github.com/Lycheetah/Lycheetah-Framework/blob/master/03_LAMAGUE_L1/22_REVERSIBLE_COMPRESSION_v1.0/docs/CLAIM_BOUNDARY.md"

[project.scripts]
lamague-codec = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["lamague_codec", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
