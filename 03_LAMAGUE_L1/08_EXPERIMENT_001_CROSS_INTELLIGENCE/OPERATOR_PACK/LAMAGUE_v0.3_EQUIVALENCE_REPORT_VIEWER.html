<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAMAGUE v0.3 Equivalence Report Viewer</title>
<style>
:root{color-scheme:dark;background:#07090d;color:#ece8dc;font-family:Inter,system-ui,sans-serif}
body{max-width:1100px;margin:auto;padding:32px}
h1{font-size:clamp(2rem,5vw,4.5rem);margin:.1em 0}
p{line-height:1.6;color:#b9b6ad}
.panel{border:1px solid #343946;border-radius:18px;padding:20px;margin:20px 0;background:#0d1118}
input{display:block;width:100%;padding:18px;border:1px dashed #616979;border-radius:14px;background:#080b10;color:#eee}
.case{border-top:1px solid #2c313b;padding:18px 0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#252b36;margin-right:6px;font-size:.8rem}
details{margin:10px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#080b10;padding:14px;border-radius:12px;overflow:auto}
.safe{border-left:4px solid #8fd5a6;padding-left:12px}
.warn{border-left:4px solid #e8c675;padding-left:12px}
.danger{border-left:4px solid #e28d8d;padding-left:12px}
</style>
</head>
<body>
<h1>LAMAGUE v0.3</h1>
<p>Cross-Intelligence Equivalence Report Viewer. Load a benchmark JSON report generated by the offline harness.</p>
<div class="panel">
<input id="file" type="file" accept=".json,application/json">
<div id="summary"></div>
<div id="output"></div>
</div>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('file').addEventListener('change', async e => {
 const file=e.target.files[0]; if(!file)return;
 const data=JSON.parse(await file.text());
 document.getElementById('summary').innerHTML =
  `<p><span class="badge">${esc(data.runtime)}</span><span class="badge">${data.case_count} cases</span></p>`;
 document.getElementById('output').innerHTML = data.results.map(r=>{
  const c=r.consensus;
  const cls=c.status.includes('SAFE')?'safe':c.status==='SPLIT'?'warn':'danger';
  return `<section class="case ${cls}">
   <h2>${esc(r.case.title)}</h2>
   <p><span class="badge">${esc(c.status)}</span> ${esc(c.explanation)}</p>
   <p><strong>Expression:</strong> ${esc(r.case.source_expression)}</p>
   <p><strong>Safe:</strong> ${esc(c.safe_decoders.join(', ')||'none')}</p>
   <p><strong>Unsafe:</strong> ${esc(c.unsafe_decoders.join(', ')||'none')}</p>
   <p><strong>Divergent:</strong> ${esc(c.divergent_decoders.join(', ')||'none')}</p>
   ${c.comparisons.map(x=>`<details><summary>${esc(x.candidate_decoder)} — ${esc(x.classification)}</summary>
    <p>${esc(x.explanation)}</p>
    <pre>${esc(JSON.stringify(x.differences,null,2))}</pre></details>`).join('')}
  </section>`;
 }).join('');
});
</script>
</body>
</html>
