name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

# Cancel superseded runs on the same ref — a stale run proves nothing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor matches requires-python = ">=3.10" in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --tb=short --strict-markers

      - name: Run ACTIVE-claim tests only
        run: |
          pytest tests/ -q -m active --strict-markers
          echo "All [ACTIVE] claim tests passed."

  quality:
    name: Lint, types, packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format check)
        run: ruff format --check --diff .

      - name: Mypy (public package)
        run: mypy lycheetah/

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the built wheel actually works
        # The wheel used to install cleanly and then raise ModuleNotFoundError on
        # every advertised entry point, because the implementation tree was never
        # packaged. Importing from a clean venv outside the source checkout is the
        # only check that would have caught it — a source-tree test cannot.
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --upgrade pip
          /tmp/wheelcheck/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheelcheck/bin/python -c "
          import lycheetah
          report = lycheetah.check('I absolutely guarantee this is correct.')
          assert 0.0 <= report.alignment_percent <= 100.0, report.alignment_percent
          assert isinstance(report.overall_pass, bool)
          print('wheel OK — lycheetah.check() ->', round(report.alignment_percent, 1))
          "
          /tmp/wheelcheck/bin/lycheetah-check "smoke test" > /dev/null
          echo "console script OK"

  framework-health:
    name: Alexandria health and drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Blocking: both are regression gates. They exit non-zero on real failure,
      # and the drift audit now also fails when it cannot evaluate a check rather
      # than reporting "no divergence" while silently skipping every one.
      - name: Alexandria health check
        run: python 12_IMPLEMENTATIONS/alexandria_agent.py health

      - name: Alexandria drift audit
        run: python 12_IMPLEMENTATIONS/alexandria_agent.py drift

      # Non-blocking: the gap report tracks aspirational work that is legitimately
      # incomplete, so a RED entry is information, not a regression. Blocking on it
      # would only teach us to delete rows.
      - name: Alexandria gap report (informational)
        continue-on-error: true
        run: python 12_IMPLEMENTATIONS/alexandria_agent.py gaps

  corpus-integrity:
    name: Claims marked and links resolving
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Every claim-bearing document declares its footing
        run: python tools/verify-claims.py --quiet

      - name: Internal links resolve
        run: python tools/verify-links.py
