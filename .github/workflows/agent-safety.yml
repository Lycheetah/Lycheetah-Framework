name: Agent Safety Research Controls

on:
  push:
    paths:
      - 'papers/agent-safety/**'
      - '.github/workflows/agent-safety.yml'
  pull_request:
    paths:
      - 'papers/agent-safety/**'
      - '.github/workflows/agent-safety.yml'

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests and synthetic comparisons
        working-directory: papers/agent-safety/simulator
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          python3 run_experiments.py --output "$RUNNER_TEMP/scripted-controls"
          python3 adversarial_checks.py --output "$RUNNER_TEMP/adversarial-checks"
      - name: Public compensation race fixtures
        working-directory: papers/agent-safety/compensation-race-benchmark
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compensation_race.benchmark --rounds 1000 --output "$RUNNER_TEMP/compensation-race.json"
