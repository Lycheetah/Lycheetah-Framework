name: Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all]" build

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short \
          --cov=lycheetah \
          --cov-report=term-missing \
          -m "not conjecture"

    - name: Run active-only (no scaffold)
      run: |
        python -m pytest tests/ -q -m "active"
        echo "All [ACTIVE] claim tests passed."

    - name: Run strict policy regression gate
      run: |
        mkdir -p build/assurance
        lycheetah-assure eval \
          examples/assurance/customer_support_eval.jsonl \
          --policy examples/assurance/customer_support_policy.json \
          --report-file build/assurance/customer-support-candidate.json
        lycheetah-assure compare-eval \
          examples/assurance/customer_support_baseline.eval.json \
          build/assurance/customer-support-candidate.json \
          --report-file build/assurance/customer-support-regression.json
        lycheetah-assure verify-regression \
          build/assurance/customer-support-regression.json --json

    - name: Build wheel
      run: python -m build --wheel

    - name: Smoke-test wheel in isolation
      shell: bash
      run: |
        wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
        python -m venv /tmp/lycheetah-wheel-base
        /tmp/lycheetah-wheel-base/bin/pip install "${wheel_path}"
        /tmp/lycheetah-wheel-base/bin/python tools/verify_base_distribution.py
        python -m venv /tmp/lycheetah-wheel-smoke
        /tmp/lycheetah-wheel-smoke/bin/pip install "${wheel_path}[all]"
        /tmp/lycheetah-wheel-smoke/bin/python tools/verify_installed_distribution.py
