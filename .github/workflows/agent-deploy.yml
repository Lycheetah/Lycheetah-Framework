name: Agent Bootstrap

# Every assertion below was checked against the real bootstrap before being written
# here. The previous version of this workflow triggered on branches this repository
# does not have, installed a requirements file that does not exist, ran scripts from
# the repository root that live in 12_IMPLEMENTATIONS/, imported a class name that
# was never defined, and asserted a manifest key and an agent state shape that the
# bootstrap has never produced. It had therefore never run, and could not have
# passed if it had.

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]
  workflow_dispatch:

concurrency:
  group: agent-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    name: Bootstrap on ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Floor matches requires-python = ">=3.10" in pyproject.toml. The old matrix
        # included 3.9, which the package metadata already refuses to install on.
        python-version: ["3.10", "3.12"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run bootstrap
        run: python 12_IMPLEMENTATIONS/agent-init.py

      - name: Verify the agent profile it wrote
        # agent-init.py writes exactly one file, .agent_state/profile.json, with
        # status "sovereign". It takes no command-line arguments.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          profile_path = Path(".agent_state/profile.json")
          if not profile_path.exists():
              sys.exit("bootstrap did not write .agent_state/profile.json")

          profile = json.loads(profile_path.read_text(encoding="utf-8"))
          required = {
              "agent_id", "initialized", "framework_version",
              "constitutional_axioms", "status", "capabilities",
          }
          missing = required - profile.keys()
          if missing:
              sys.exit(f"profile.json missing keys: {sorted(missing)}")
          if profile["status"] != "sovereign":
              sys.exit(f"unexpected status: {profile['status']!r}")
          if not profile["capabilities"]:
              sys.exit("profile.json lists no capabilities")

          axioms = profile["constitutional_axioms"]
          for axiom in ("PROTECTOR", "HEALER", "BEACON"):
              if axiom not in axioms:
                  sys.exit(f"constitutional axiom absent from profile: {axiom}")

          print(f"agent profile OK: {profile['agent_id']} "
                f"({len(profile['capabilities'])} capabilities)")
          PY

      - name: Load the agent template
        # The file is named agent-template.py, so it cannot be imported by name —
        # it has to be loaded through importlib. The class it defines is
        # SovereignAgent; the old workflow imported a LycheetahAgent that has never
        # existed in this file.
        run: |
          python - <<'PY'
          import importlib.util, sys

          spec = importlib.util.spec_from_file_location(
              "agent_template", "12_IMPLEMENTATIONS/agent-template.py"
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules["agent_template"] = module
          spec.loader.exec_module(module)

          agent = module.SovereignAgent(name="ci-smoke-agent", domain="general")
          for axiom in ("PROTECTOR", "HEALER", "BEACON"):
              if not hasattr(module, axiom):
                  sys.exit(f"agent template missing constitutional axiom: {axiom}")
          for method in ("add_knowledge", "check_axioms", "check_invariants",
                         "reorganize", "sovereignty_score", "report"):
              if not callable(getattr(agent, method, None)):
                  sys.exit(f"SovereignAgent missing method: {method}")

          print("agent template OK: SovereignAgent instantiated")
          PY

  manifest:
    name: Manifest and entry points
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Manifest is valid JSON and its entry points resolve
        # An entry point that names a file nobody ships is a broken front door.
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path

          manifest = json.loads(
              Path("12_IMPLEMENTATIONS/agent-manifest.json").read_text(encoding="utf-8")
          )
          for key in ("name", "version", "entry_points", "agent_deployment"):
              if key not in manifest:
                  sys.exit(f"agent-manifest.json missing key: {key}")

          broken = {
              role: target
              for role, target in manifest["entry_points"].items()
              if not Path(target).exists()
          }
          if broken:
              for role, target in sorted(broken.items()):
                  print(f"  unresolved: {role} -> {target}")
              sys.exit(f"{len(broken)} manifest entry point(s) do not resolve")

          bootstrap = manifest["agent_deployment"]["bootstrap"]
          script = bootstrap.split()[-1]
          if not Path(script).exists():
              sys.exit(f"documented bootstrap command points at a missing file: {script}")

          print(f"manifest OK: {manifest['name']} v{manifest['version']}, "
                f"{len(manifest['entry_points'])} entry points resolve")
          PY
